server:
  port: 8083

spring:
  application:
    name: request-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/request_db}
    username: ${SPRING_DATASOURCE_USERNAME:avelrune}
    password: ${SPRING_DATASOURCE_PASSWORD:avelrune}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

property:
  service-url: ${PROPERTY_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
