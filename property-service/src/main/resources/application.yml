server:
  port: 8082
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: property-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/property_db}
    username: ${SPRING_DATASOURCE_USERNAME:avelrune}
    password: ${SPRING_DATASOURCE_PASSWORD:avelrune}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

app:
  media:
    dir: ${APP_MEDIA_DIR:./data/media}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    url: /api/docs/property/openapi.json
    config-url: /api/docs/property/v3/api-docs/swagger-config
    disable-swagger-default-url: true
