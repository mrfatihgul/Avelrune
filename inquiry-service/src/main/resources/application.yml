server:
  port: 8083
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: inquiry-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inquiry_db}
    username: ${SPRING_DATASOURCE_USERNAME:avelrune}
    password: ${SPRING_DATASOURCE_PASSWORD:avelrune}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

property:
  service-url: ${PROPERTY_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    url: /api/docs/inquiries/openapi.json
    config-url: /api/docs/inquiries/v3/api-docs/swagger-config
    disable-swagger-default-url: true
