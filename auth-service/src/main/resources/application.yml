server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:avelrune}
    password: ${SPRING_DATASOURCE_PASSWORD:avelrune}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  keys-dir: ${JWT_KEYS_DIR:/app/keys}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    url: /api/docs/auth/v3/api-docs
    config-url: /api/docs/auth/v3/api-docs/swagger-config
    disable-swagger-default-url: true
