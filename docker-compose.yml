services:
  postgres:
    image: postgres:16-alpine
    container_name: avelrune-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avelrune}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avelrune}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d auth_db && pg_isready -U \"$$POSTGRES_USER\" -d property_db && pg_isready -U \"$$POSTGRES_USER\" -d inquiry_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - avelrune-net

  auth-service:
    build:
      context: ./auth-service
    container_name: avelrune-auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-avelrune}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-avelrune}
      JWT_KEYS_DIR: /app/keys
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - jwt-keys:/app/keys
      - ./infra/dev/flyway/auth:/app/db/dev:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - avelrune-net

  property-service:
    build:
      context: ./property-service
    container_name: avelrune-property
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/property_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-avelrune}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-avelrune}
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ./infra/dev/flyway/property:/app/db/dev:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 50s
    networks:
      - avelrune-net

  inquiry-service:
    build:
      context: ./inquiry-service
    container_name: avelrune-inquiry
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inquiry_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-avelrune}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-avelrune}
      PROPERTY_SERVICE_URL: http://property-service:8082
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      postgres:
        condition: service_healthy
      property-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - avelrune-net

  api-gateway:
    build:
      context: ./api-gateway
    container_name: avelrune-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      PROPERTY_SERVICE_URL: http://property-service:8082
      INQUIRY_SERVICE_URL: http://inquiry-service:8083
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      CORS_ORIGINS: ${SITE_URL:-https://localhost}
    volumes:
      - jwt-keys:/app/keys:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.gateway.rule=PathPrefix(`/api`)
      - traefik.http.routers.gateway.entrypoints=websecure
      - traefik.http.routers.gateway.tls=true
      - traefik.http.routers.gateway.priority=10
      - traefik.http.services.gateway.loadbalancer.server.port=8080
    depends_on:
      auth-service:
        condition: service_healthy
      property-service:
        condition: service_healthy
      inquiry-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - avelrune-net

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api-gateway:8080
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://localhost}
    container_name: avelrune-frontend
    environment:
      API_INTERNAL_URL: http://api-gateway:8080
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://localhost}
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - avelrune-net

  traefik:
    image: traefik:v3.6.2
    container_name: avelrune-traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=avelrune-net
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./infra/tls/localhost.crt:/certs/localhost.crt:ro
      - ./infra/tls/localhost.key:/certs/localhost.key:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - avelrune-net

volumes:
  postgres_data:
  jwt-keys:

networks:
  avelrune-net:
    name: avelrune-net
    driver: bridge
