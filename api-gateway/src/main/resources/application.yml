server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - HEAD
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - X-Access-Token
            allowCredentials: false
      routes:
        - id: auth-docs-postman
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/docs/auth/v3/api-docs
            - Method=GET,HEAD
          filters:
            - RewritePath=/api/docs/auth/v3/api-docs, /v3/api-docs
            - AddRequestHeader=X-Forwarded-Prefix, /api/docs/auth
            - OpenApiToPostman
        - id: property-docs-postman
          uri: ${PROPERTY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/docs/property/v3/api-docs
            - Method=GET,HEAD
          filters:
            - RewritePath=/api/docs/property/v3/api-docs, /v3/api-docs
            - AddRequestHeader=X-Forwarded-Prefix, /api/docs/property
            - OpenApiToPostman
        - id: inquiry-docs-postman
          uri: ${INQUIRY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/docs/inquiries/v3/api-docs
            - Method=GET,HEAD
          filters:
            - RewritePath=/api/docs/inquiries/v3/api-docs, /v3/api-docs
            - AddRequestHeader=X-Forwarded-Prefix, /api/docs/inquiries
            - OpenApiToPostman
        - id: auth-docs-json
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/docs/auth/openapi.json,/api/docs/auth/swagger.json
          filters:
            - RewritePath=/api/docs/auth/.*, /v3/api-docs
            - AddRequestHeader=X-Forwarded-Prefix, /api/docs/auth
        - id: property-docs-json
          uri: ${PROPERTY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/docs/property/openapi.json,/api/docs/property/swagger.json
          filters:
            - RewritePath=/api/docs/property/.*, /v3/api-docs
            - AddRequestHeader=X-Forwarded-Prefix, /api/docs/property
        - id: inquiry-docs-json
          uri: ${INQUIRY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/docs/inquiries/openapi.json,/api/docs/inquiries/swagger.json
          filters:
            - RewritePath=/api/docs/inquiries/.*, /v3/api-docs
            - AddRequestHeader=X-Forwarded-Prefix, /api/docs/inquiries
        - id: auth-docs
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/docs/auth/**
          filters:
            - RewritePath=/api/docs/auth/(?<path>.*), /$\{path}
            - AddRequestHeader=X-Forwarded-Prefix, /api/docs/auth
        - id: property-docs
          uri: ${PROPERTY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/docs/property/**
          filters:
            - RewritePath=/api/docs/property/(?<path>.*), /$\{path}
            - AddRequestHeader=X-Forwarded-Prefix, /api/docs/property
        - id: inquiry-docs
          uri: ${INQUIRY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/docs/inquiries/**
          filters:
            - RewritePath=/api/docs/inquiries/(?<path>.*), /$\{path}
            - AddRequestHeader=X-Forwarded-Prefix, /api/docs/inquiries
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: property-public
          uri: ${PROPERTY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/properties/**
        - id: agents
          uri: ${PROPERTY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/agents/**
        - id: property-admin
          uri: ${PROPERTY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/properties/**
        - id: property-stats
          uri: ${PROPERTY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/stats
        - id: inquiry-service
          uri: ${INQUIRY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/inquiries,/api/inquiries/**

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:/app/keys/public.pem}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  writer-with-default-pretty-printer: true
  api-docs:
    path: /api/docs/gateway/v3/api-docs
  swagger-ui:
    enabled: false
