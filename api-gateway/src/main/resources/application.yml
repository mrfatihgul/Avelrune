server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - ${CORS_ORIGINS:http://localhost}
              - http://localhost
              - http://localhost:*
              - http://127.0.0.1
              - http://127.0.0.1:*
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: property-public
          uri: ${PROPERTY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/properties/**
        - id: agents
          uri: ${PROPERTY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/agents/**
        - id: property-admin
          uri: ${PROPERTY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/properties/**
        - id: property-stats
          uri: ${PROPERTY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/stats
        - id: request-service
          uri: ${REQUEST_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/requests,/api/requests/**

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:/app/keys/public.pem}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
